services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SNOW_DOMAIN=${SNOW_DOMAIN}
      - CADDY_ACME_EMAIL=${CADDY_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - snow_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      snow-mcp-gateway:
        condition: service_healthy
      snow-relay:
        condition: service_healthy

  snow-mcp-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    expose:
      - "8771"
    environment:
      - SNOW_MCP_PUBLIC_URL=https://${SNOW_DOMAIN}
      - SNOW_MCP_TRUSTED_PROXIES=${SNOW_MCP_TRUSTED_PROXIES:-caddy,127.0.0.1,::1}
      - SNOW_DATA_DIR=/home/snow/.snow
    volumes:
      - snow_data:/home/snow/.snow
    networks:
      - snow_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  snow-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["python", "-m", "snow.relay"]
    restart: unless-stopped
    expose:
      - "8770"
    environment:
      - SNOW_RELAY_HOST=0.0.0.0
      - SNOW_RELAY_PORT=8770
      - SNOW_RELAY_SECRET=${SNOW_RELAY_SECRET:-}
      - SNOW_RELAY_ENABLED=true
    networks:
      - snow_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8770/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  snow_data:
  caddy_data:
  caddy_config:

networks:
  snow_net:
    driver: bridge
