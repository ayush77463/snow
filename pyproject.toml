[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snow"
version = "5.2.0"
description = "SNOW — Headless cross-device AI capability bridge"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psutil>=6.0.0",
    "websockets>=13.0",
    "cryptography>=43.0.0",
    "aiohttp>=3.10.0",
    "mcp>=1.0.0,<2.0.0",
    "qrcode>=8.0",
]

[project.scripts]
snow = "snow.cli:main"
snow-mcp = "snow.mcp.__main__:main"
snow-relay = "snow.relay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"snow.web" = ["static/*"]
